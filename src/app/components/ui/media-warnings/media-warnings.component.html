@if (warnings().length) {
  <div class="wrapper pt-4 flex flex-col gap-3" role="status" aria-live="polite">
    @for (warning of warnings(); track warning.projectUuid) {
      <div data-media-warning class="relative flex items-start gap-3 rounded-md border border-amber-500/60 bg-amber-500/10 px-4 py-3">
        <span aria-hidden="true" class="mt-0.5 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-amber-500 text-lg font-bold text-amber-500">!</span>
        <span class="sr-only">Warning:</span>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold leading-5 text-amber-400">{{ warning.title }}</p>
          <p data-media-warning-content class="text-sm leading-5 text-gray-200 whitespace-pre-line break-words">{{ warning.content }}</p>
        </div>
        <button data-media-warning-dismiss type="button" (click)="dismiss(warning.projectUuid)" class="shrink-0 text-gray-400 hover:text-gray-200">
          <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
          <span class="sr-only">Dismiss</span>
        </button>
      </div>
    }
  </div>
}
