<div class="wrapper">
  <app-page-header
    icon="pencil"
    [title]="project?.name"
    [titleTemplate]="project ? titleBlock : null">

    <ng-template #titleBlock>
      @if (!isEditingTitle()) {
        <div class="flex items-center gap-2 group">
          <h1 class="text-2xl font-bold">{{ project?.name }}</h1>
          <button
            type="button"
            class="hidden group-hover:block opacity-60 hover:opacity-100 transition-opacity"
            (click)="startEditTitle()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="cursor-pointer size-5 ml-2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
            </svg>            
          </button>
        </div>
      } @else {
        <div class="flex flex-col gap-2 w-full max-w-md">
          <input
            type="text"
            class="text-2xl font-bold bg-dark-300 outline-none border-0 border-b border-dark-100 focus:border-primary p-0"
            [value]="tempName()"
            (input)="tempName.set($any($event.target).value)"
            (keydown.enter)="applyEditTitle()"
            (keydown.escape)="cancelEditTitle()"
            autofocus />
      
          <textarea
            rows="3"
            class="w-full text-sm bg-dark-300 outline-none border-0 border-b border-dark-100 focus:border-primary p-0"
            placeholder="{{ 'project.edit.description.placeholder' | translate }}"
            [value]="tempDescription()"
            (input)="tempDescription.set($any($event.target).value)"></textarea>
      
          <div class="flex items-center justify-end gap-2">
            <button type="button" class="text-xs" (click)="applyEditTitle()">
              {{ 'project.edit.apply' | translate }}              
            </button>
            <button type="button" class="text-xs" (click)="cancelEditTitle()">
              {{ 'project.edit.cancel' | translate }}
            </button>
          </div>
        </div>
      }
    </ng-template>

    <div class="flex items-center gap-4" actions>
      <button
        *ngIf="hasUnsavedChanges"
        class="btn btn-small btn-tertiary gap-2"
        (click)="saveAllChanges()">
        <app-icon icon="upload" class="w-[12px] h-[12px]"></app-icon>
        {{ 'project.edit.save.changes' | translate }}
      </button>

      <a [routerLink]="['/projects', project?.uuid]" class="btn btn-small btn-secondary gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-4 h-4"><polygon points="5,3 19,12 5,21"></polygon></svg>
        {{ 'project.show' | translate }}
      </a>
      <button
        type="button"
        class="flex items-center gap-2 cursor-pointer"
        (click)="closeWorkspaceProject()">
        <span class="text-sm">{{ 'close' | translate }} {{ 'project' | translate }}</span>
        <app-icon icon="closeCircle" class="w-4 h-4"></app-icon>
      </button>
    </div>
  </app-page-header>
</div>

<div class="wrapper">
  
  <!-- Tab routes -->
  <div class="mt-6 border-b border-dark-300">
    <div class="flex justify-between">
      <nav class="flex space-x-4">
        <a routerLink="sequence" routerLinkActive="bg-dark-300 text-white" class="px-4 py-2 text-sm font-medium rounded-t-lg">
          {{ 'project.sequence' | translate }}
      </a>      
      <a routerLink="audio-mixer" routerLinkActive="bg-dark-300 text-white" class="pointer-events-none text-muted px-4 py-2 text-sm font-medium rounded-t-lg">
        {{ 'project.audio-mixer' | translate }}
      </a>
      <a routerLink="video-mixer" routerLinkActive="bg-dark-300 text-white" class="pointer-events-none text-muted px-4 py-2 text-sm font-medium rounded-t-lg">
        {{ 'project.video-mixer' | translate }}
      </a>
      <a routerLink="dmx-mixer" routerLinkActive="bg-dark-300 text-white" class="px-4 py-2 text-sm font-medium rounded-t-lg">
          {{ 'project.dmx-mixer' | translate }}
        </a>
      </nav>

      <div class="flex items-center gap-2">
        <button class="btn btn-small btn-muted space-x-2">
          <app-icon icon="eye"></app-icon>
          <span>{{ 'project.button.list' | translate }} / {{ 'project.button.timeline' | translate }}</span>
        </button>

        <button class="btn btn-small btn-muted space-x-2" (click)="toggleActivityDrawer()">
          <app-icon icon="activity"></app-icon>
          <span>{{ 'project.button.activity' | translate }} / {{ 'project.button.warnings' | translate }}</span>
        </button>
        
        <button class="btn btn-small btn-muted space-x-2">
          <app-icon icon="star"></app-icon>
          <span>{{ 'project.button.effects' | translate }}</span>
        </button>
      </div>
    </div>
  </div>
  
  <div class="mt-4">
    <router-outlet></router-outlet>
  </div>
</div>
